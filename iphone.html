<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sécurité iPhone</title>
<style>
body{margin:0;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,Arial;text-align:center;color:#111}
.box{margin:70px 18px;background:white;border-radius:18px;padding:30px 20px;box-shadow:0 4px 20px #bbb}
.icon{font-size:60px}
h1{color:#d70015;font-size:25px}
p{font-size:17px;line-height:1.5}
button{background:#007aff;color:white;border:0;border-radius:12px;padding:14px 25px;font-size:17px}
.small{font-size:12px;color:#777;margin-top:25px}
</style>
</head>
<body>
<div class="box">
<div class="icon">⚠️</div>
<h1>ALERTE DE SÉCURITÉ</h1>
<p><b>3 menaces potentielles détectées.</b></p>
<p>Votre appareil doit être vérifié immédiatement.</p>
<p id="count">Analyse de sécurité en cours…</p>
<button onclick="alert('😄 C’était une blague ! Aucun virus n’a été installé.')">
Lancer la vérification
</button>
<p class="small">Simulation — aucun logiciel malveillant n'est installé.</p>
</div>

<script>
let n=10;
setInterval(()=>{
 if(n>0){
  document.getElementById("count").textContent=
  "Analyse terminée dans "+n+" secondes…";
  n--;
 }
},1000);
</script>
</body>
</html>
